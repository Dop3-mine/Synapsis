name: Compilar APK de Synapsis

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Descomprimir el proyecto
        run: |
          ls -la
          unzip -q synapsis-android-proyecto.zip
          ls -la synapsis-android

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Aceptar licencias del SDK de Android
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          SM=$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | sort -V | tail -1)
          echo "sdkmanager: $SM"
          yes | "$SM" --licenses > /dev/null || true

      - name: Compilar
        working-directory: synapsis-android
        run: gradle assembleDebug --no-daemon --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: synapsis-apk
          path: synapsis-android/app/build/outputs/apk/debug/app-debug.apk
